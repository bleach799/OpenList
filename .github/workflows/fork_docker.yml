name: Fork Docker Image

# Builds this fork's branch into ghcr.io/<owner>/openlist for linux/amd64 and
# linux/arm64. It leaves the upstream release workflows alone, which only run
# for main, tags and pull requests.

on:
  push:
    branches:
      - quark-webdav-fix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Test, build and push the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'

      - name: Test
        run: go test ./drivers/quark_uc/ ./internal/op/ ./server/webdav/

      - name: Build binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/musl-libs
          for cc in x86_64-linux-musl-cross aarch64-linux-musl-cross; do
            curl -fsSL "https://github.com/OpenListTeam/musl-compilers/releases/latest/download/$cc.tgz" |
              tar xz --strip-components 1 -C build/musl-libs
          done
          export PATH=$PATH:$PWD/build/musl-libs/bin
          # fetches the frontend and defines the build helpers without building anything
          source build.sh beta web
          for target in amd64:x86_64-linux-musl-gcc arm64:aarch64-linux-musl-gcc; do
            arch=${target%%:*}
            GOOS=linux GOARCH=$arch CC=${target##*:} CGO_ENABLED=1 CGO_LDFLAGS="-static" \
              go build -o build/linux/$arch/openlist -ldflags="$(GetMuslStaticLdflags)" -tags="$(GetBuildTagsForTarget linux-$arch)" .
            AssertStaticBinary build/linux/$arch/openlist
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openlist
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          build-args: BASE_IMAGE_TAG=base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
